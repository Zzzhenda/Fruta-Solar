  <main class="container my-5">
    <h1 class="text-center mb-4">Administrar Usuarios</h1>
    <div id="usuariosTabla" class="table-responsive"></div>
    <p id="mensaje" class="text-center mt-3"></p>

    <!-- Formulario para crear usuario -->
    <!-- Botón para mostrar/ocultar el formulario -->
    <div class="text-center mb-3">
      <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#formCrearCollapse"
        aria-expanded="false" aria-controls="formCrearCollapse">
        Crear nuevo usuario
      </button>
    </div>

    <!-- Formulario para crear usuario (desplegable) -->
    <div class="collapse mb-4 mx-auto" id="formCrearCollapse" style="max-width:500px;">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Crear nuevo usuario</h5>
          <form id="formCrearUsuario">
            <div class="mb-2">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nuevoNombre" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Correo</label>
              <input type="email" class="form-control" id="nuevoCorreo" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Teléfono</label>
              <input type="tel" class="form-control" id="nuevoTelefono">
            </div>
            <div class="mb-2">
              <label class="form-label">Dirección</label>
              <input type="text" class="form-control" id="nuevoDireccion">
            </div>
            <div class="mb-2">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="nuevoPassword" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Rol</label>
              <select class="form-select" id="nuevoRol" required>
                <option value="cliente">Cliente</option>
                <option value="admin">Administrador</option>
              </select>
            </div>
            <button type="submit" class="btn btn-success w-100">Crear usuario</button>
          </form>
        </div>
      </div>
    </div>
  </main>
