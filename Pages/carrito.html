                <img src="../images/icono.png" alt="Icono Fruto Solar" width="60" height="60" class="me-2">
                <span style="font-family: 'Playfair Display', serif; font-size:1.5rem;">Fruto Solar</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item me-3"><a class="nav-link btn btn-success text-white" href="impacto.html">Impacto</a></li>

<main class="container my-5 carrito-content">

    <h1>Mi Carrito</h1>
  </div>

  <div class="table-responsive mt-4">
    <table class="table table-striped">
      <thead class="table-success">
        <tr>
          <th>Producto</th>
          <th>Precio</th>
          <th>Cantidad</th>
          <th>Subtotal</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="carrito-body"></tbody>
      <tfoot>
        <tr>
          <th colspan="3" class="text-end">Total:</th>
          <th id="total">$0</th>
          <th></th>
        </tr>
      </tfoot>
    </table>
  </div>

  <div class="text-end mt-3">
    <button class="btn btn-success" onclick="finalizarCompra()">Finalizar Compra</button>
  </div>
