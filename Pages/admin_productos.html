                📞 +56 9 1234 5678

                <a href="contacto.html" class="btn btn-sm btn-success">Contacto</a>

</header>
    <main class="container my-5">
        <h1 class="text-center mb-4">Gestión de Productos</h1>

        <div class="card p-4 mb-5">
            <h2 class="text-center mb-4">Lista de Productos</h2>
            <div class="table-responsive">
                <table class="table table-striped table-hover text-center">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Categoría</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="listaProductos">
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card p-4">
            <h2 class="text-center mb-4">Agregar/Editar Producto</h2>
            <form id="formProducto">
                <input type="hidden" id="productoId">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre del Producto</label>
                    <input type="text" class="form-control" id="nombre" required>
                </div>
                <div class="mb-3">
                    <label for="precio" class="form-label">Precio (CLP)</label>
                    <input type="number" class="form-control" id="precio" required>
                </div>
                <div class="mb-3">
                    <label for="stock" class="form-label">Stock disponible</label>
                    <input type="number" class="form-control" id="stock" required>
                </div>
                <div class="mb-3">
                    <label for="categoria" class="form-label">Categoría</label>
                    <input type="text" class="form-control" id="categoria" required>
                </div>
                <div class="mb-3">
                    <label for="imagen" class="form-label">URL de la Imagen</label>
                    <input type="text" class="form-control" id="imagen" required>
                </div>
                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <textarea class="form-control" id="descripcion" rows="3" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="origen" class="form-label">Origen</label>
                    <input type="text" class="form-control" id="origen" required>
                </div>
                <div class="mb-3">
                    <label for="sostenibilidad" class="form-label">Sostenibilidad</label>
                    <input type="text" class="form-control" id="sostenibilidad" required>
                </div>
                <div class="mb-3">
                    <label for="receta" class="form-label">Receta Sugerida</label>
                    <textarea class="form-control" id="receta" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-success w-100">Guardar Producto</button>
                <button type="button" id="btnCancelar" class="btn btn-secondary w-100 mt-2">Cancelar Edición</button>
            </form>
        </div>

    </main>
